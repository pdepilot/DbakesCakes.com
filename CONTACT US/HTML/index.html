<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../images/logo3.png">
    <title>Contact Us - Joseph's Pot</title>
    <link rel="stylesheet" href="../CSS/contact.css" />
    <link rel="stylesheet" href="../fontawesome-free-6.7.2-web/css/all.min.css">
    <script
      src="https://kit.fontawesome.com/a076d05399.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
    <script>
      (function () {
        emailjs.init("YOUR_PUBLIC_KEY"); // 🔁 Replace with your EmailJS Public Key
      })();
    </script>
  </head>
  <body>
    <header class="header">
      <div class="logo">Joseph's Pot</div>
      <nav class="nav">
        <a href="/">Home</a>
        <a href="/menu">Menu</a>
        <a href="/gallery">Gallery</a>
        <a href="/contact" class="active">Contact</a>
      </nav>
    </header>

    <section class="contact-hero">
      <h1>Get in Touch</h1>
      <p>
        We’d love to hear from you! Reach out for orders, events, or feedback.
      </p>
    </section>

    <section class="contact-container">
      <div class="contact-info">
        <h2>Contact Information</h2>
        <p>
          <i class="fas fa-map-marker-alt"></i> 123 Food Street, Lagos, Nigeria
        </p>
        <p><i class="fas fa-phone-alt"></i> +234 800 123 4567</p>
        <p><i class="fas fa-envelope"></i> hello@josephspot.com</p>
        <div class="social-icons">
          <a href="#"><i class="fab fa-facebook-f"></i></a>
          <a href="#"><i class="fab fa-instagram"></i></a>
          <a href="#"><i class="fab fa-whatsapp"></i></a>
        </div>
      </div>

      <div class="contact-form">
        <h2>Send a Message</h2>
        <form id="contactForm">
          <input
            type="text"
            name="name"
            placeholder="Your Full Name"
            required
          />
          <input
            type="email"
            name="email"
            placeholder="Your Email Address"
            required
          />
          <textarea
            name="message"
            rows="6"
            placeholder="Your Message"
            required
          ></textarea>
          <div class="g-recaptcha" data-sitekey="YOUR_RECAPTCHA_SITE_KEY"></div>
          <!-- 🔁 Replace -->
          <button type="submit">Send Message</button>
        </form>
      </div>
    </section>

    <section class="map-section">
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3979.789432128979!2d3.379205114754849!3d6.524379924407307!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x103b8c738f946c47%3A0x25ff2b3f5dfe7c77!2sLagos!5e0!3m2!1sen!2sng!4v1674821965113!5m2!1sen!2sng"
        width="100%"
        height="350"
        style="border: 0"
        allowfullscreen
        loading="lazy"
      ></iframe>
    </section>

    <a
      href="https://wa.me/2348001234567"
      class="whatsapp-float"
      target="_blank"
    >
      <i class="fab fa-whatsapp"></i>
    </a>

    <footer class="footer">
      <p>&copy; 2025 Joseph's Pot. All rights reserved.</p>
    </footer>

    <script src="../javascript/contact.js"></script>
  </body>
</html>
